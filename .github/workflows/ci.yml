name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run repository checks
        run: python3 scripts/check_repo.py

      - name: Verify checksums
        run: sha256sum -c SHA256SUMS

      - name: Build source archive (smoke test)
        run: python3 scripts/package_release.py --version 1.0.0 --output dist/SJRC-AutoReader-Repo.zip

      - name: Build platform bundles (smoke test)
        run: python3 scripts/package_downloads.py --output-dir dist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: SJRC-AutoReader-Repo
          path: |
            dist/SJRC-AutoReader-Repo.zip
            dist/SJRC-AutoReader-Repo.zip.sha256
            dist/SJRC-AutoReader-Web.zip
            dist/SJRC-AutoReader-Web.zip.sha256
            dist/SJRC-AutoReader-Android.zip
            dist/SJRC-AutoReader-Android.zip.sha256
            dist/SJRC-AutoReader-Windows.zip
            dist/SJRC-AutoReader-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
