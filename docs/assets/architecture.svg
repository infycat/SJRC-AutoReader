<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SJRC AutoReader architecture</title>
  <desc id="desc">Three independent clients share one protocol contract and talk to the SJRC HTTP API. The repository also carries reference smali source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081b21"/><stop offset="1" stop-color="#061318"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ee6a8"/><stop offset="1" stop-color="#43b7ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l8 3-8 3z" fill="#5f8790"/></marker>
    <style>
      .box{fill:#0b2b33;stroke:#245360;stroke-width:1.5}
      .boxhi{fill:#0d3540;stroke:#2ee6a8;stroke-width:2}
      .t{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e9fffa}
      .s{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8fb7be}
      .m{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#b7d9de}
      .lbl{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#5f8790;font-size:11px;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="48" y="56" class="t" font-size="28" font-weight="700">System context</text>
  <text x="48" y="82" class="s" font-size="14">Three builds, no shared runtime — the protocol is the contract.</text>
  <rect x="48" y="108" width="1104" height="228" rx="18" fill="#06171c" stroke="#173b44"/>
  <text x="70" y="136" class="lbl">CLIENTS</text>
  <g>
    <rect x="70" y="154" width="330" height="156" rx="14" class="boxhi"/>
    <text x="92" y="184" class="t" font-size="19" font-weight="650">Web</text>
    <text x="92" y="208" class="s" font-size="12.5">web/SJRC_AutoReader.html · 86 KB</text>
    <text x="92" y="231" class="m" font-size="12.5">vanilla HTML/CSS/JS · localStorage</text>
    <text x="92" y="254" class="m" font-size="12.5">Google GIS or email + password</text>
    <text x="92" y="277" class="s" font-size="12">Serve over HTTP; file:// breaks OAuth</text>
    <rect x="427" y="154" width="330" height="156" rx="14" class="box"/>
    <text x="449" y="184" class="t" font-size="19" font-weight="650">Android</text>
    <text x="449" y="208" class="s" font-size="12.5">phone/SJRC_AutoRead.apk · 53 KB</text>
    <text x="449" y="231" class="m" font-size="12.5">WebView wrapper · minSdk 23</text>
    <text x="449" y="254" class="m" font-size="12.5">email + password only</text>
    <text x="449" y="277" class="s" font-size="12">assets/index.html loaded from APK</text>
    <rect x="784" y="154" width="348" height="156" rx="14" class="box"/>
    <text x="806" y="184" class="t" font-size="19" font-weight="650">Windows</text>
    <text x="806" y="208" class="s" font-size="12.5">pc/SJRC_AutoReader.exe · 991 KB</text>
    <text x="806" y="231" class="m" font-size="12.5">native Win32 + WinHTTP · C++17</text>
    <text x="806" y="254" class="m" font-size="12.5">token import or local OAuth helper</text>
    <text x="806" y="277" class="s" font-size="12">HKCU\Software\SJRC\AutoReader</text>
  </g>
  <rect x="48" y="364" width="1104" height="146" rx="18" fill="#071d23" stroke="#245360"/>
  <text x="70" y="392" class="lbl">SHARED BEHAVIOURAL CONTRACT</text>
  <g class="m" font-size="12.5">
    <rect x="70" y="408" width="240" height="78" rx="10" fill="#0b2b33" stroke="#1d4b56"/>
    <text x="86" y="432" class="t" font-size="14" font-weight="600">Session lifecycle</text>
    <text x="86" y="453">start → heartbeat → end</text>
    <text x="86" y="472">stop at target, quota, failure</text>
    <rect x="326" y="408" width="240" height="78" rx="10" fill="#0b2b33" stroke="#1d4b56"/>
    <text x="342" y="432" class="t" font-size="14" font-weight="600">Timing</text>
    <text x="342" y="453">heartbeat every 3 s, time=3 s</text>
    <text x="342" y="472">page turn every 20 s (default)</text>
    <rect x="582" y="408" width="240" height="78" rx="10" fill="#0b2b33" stroke="#1d4b56"/>
    <text x="598" y="432" class="t" font-size="14" font-weight="600">Units</text>
    <text x="598" y="453">quota and time are seconds</text>
    <text x="598" y="472">28800 s = 8 h · 10933 s ≈ 3.04 h</text>
    <rect x="838" y="408" width="294" height="78" rx="10" fill="#0b2b33" stroke="#1d4b56"/>
    <text x="854" y="432" class="t" font-size="14" font-weight="600">Auth</text>
    <text x="854" y="453">x-auth-schema CLIENT or PUBLIC</text>
    <text x="854" y="472">Bearer only for CLIENT + token</text>
  </g>
  <rect x="48" y="540" width="700" height="156" rx="18" fill="#082027" stroke="#2ee6a8" stroke-opacity="0.45"/>
  <text x="70" y="568" class="lbl">NETWORK BOUNDARY</text>
  <text x="70" y="595" class="t" font-size="18" font-weight="650">https://api.sjrc.club/</text>
  <text x="70" y="620" class="m" font-size="12.5">HTTPS · JSON · 60 s timeouts · redirects disabled · no certificate pinning</text>
  <text x="70" y="642" class="m" font-size="12.5">Reading endpoints, bookshelf, homepage, account and token refresh routes</text>
  <text x="70" y="670" class="s" font-size="12">Only the account owner's token is sent. No backend, proxy, telemetry or analytics.</text>
  <rect x="772" y="540" width="380" height="156" rx="18" fill="#071d23" stroke="#245360"/>
  <text x="794" y="568" class="lbl">REFERENCE MATERIAL</text>
  <text x="794" y="596" class="t" font-size="16" font-weight="650">sjrc-source/ · 4,888 smali classes</text>
  <text x="794" y="620" class="m" font-size="12.5">Decompiled from the public 2.9.0 client</text>
  <text x="794" y="642" class="m" font-size="12.5">Used to recover headers, units and flow</text>
  <text x="794" y="668" class="s" font-size="12">Research reference — not linked into any build</text>
  <g stroke="#5f8790" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <path d="M245 310v52"/><path d="M592 310v52"/><path d="M958 310v52"/>
    <path d="M592 510v28"/><path d="M360 568h-90v-42"/>
  </g>
  <text x="620" y="530" class="lbl">HTTPS / JSON</text>
</svg>
