<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SJRC AutoReader 架構</title>
  <desc id="desc">三種獨立客戶端共用同一套協議契約，並直接連線至 SJRC HTTP API。儲存庫也包含 smali 參考原始碼。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fafb"/><stop offset="1" stop-color="#edf4f5"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ee6a8"/><stop offset="1" stop-color="#43b7ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l8 3-8 3z" fill="#4e6d75"/></marker>
    <style>
      .box{fill:#f2f7f8;stroke:#b8cdd2;stroke-width:1.5}
      .boxhi{fill:#e8f5f1;stroke:#2ee6a8;stroke-width:2}
      .t{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',Inter,'Segoe UI',sans-serif;fill:#18343b}
      .s{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',Inter,'Segoe UI',sans-serif;fill:#4d6a72}
      .m{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',Inter,'Segoe UI',sans-serif;fill:#344f56}
      .lbl{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',Inter,'Segoe UI',sans-serif;fill:#4e6d75;font-size:11px;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="48" y="56" class="t" font-size="28" font-weight="700">系統概觀</text>
  <text x="48" y="82" class="s" font-size="14">三種獨立版本，不共用執行環境；協議就是共同契約。</text>
  <rect x="48" y="108" width="1104" height="228" rx="18" fill="#eaf2f3" stroke="#c9dde1"/>
  <text x="70" y="136" class="lbl">客戶端</text>
  <g>
    <rect x="70" y="154" width="330" height="156" rx="14" class="boxhi"/>
    <text x="92" y="184" class="t" font-size="19" font-weight="650">Web</text>
    <text x="92" y="208" class="s" font-size="12.5">web/SJRC_AutoReader.html · 86 KB</text>
    <text x="92" y="231" class="m" font-size="12.5">原生 HTML/CSS/JS · localStorage</text>
    <text x="92" y="254" class="m" font-size="12.5">Google GIS 或電郵與密碼</text>
    <text x="92" y="277" class="s" font-size="12">請以 HTTP 提供；file:// 無法使用 OAuth</text>
    <rect x="427" y="154" width="330" height="156" rx="14" class="box"/>
    <text x="449" y="184" class="t" font-size="19" font-weight="650">Android</text>
    <text x="449" y="208" class="s" font-size="12.5">phone/SJRC_AutoRead.apk · 53 KB</text>
    <text x="449" y="231" class="m" font-size="12.5">WebView 外殼 · minSdk 23</text>
    <text x="449" y="254" class="m" font-size="12.5">僅支援電郵與密碼</text>
    <text x="449" y="277" class="s" font-size="12">從 APK 載入 assets/index.html</text>
    <rect x="784" y="154" width="348" height="156" rx="14" class="box"/>
    <text x="806" y="184" class="t" font-size="19" font-weight="650">Windows</text>
    <text x="806" y="208" class="s" font-size="12.5">pc/SJRC_AutoReader.exe · 991 KB</text>
    <text x="806" y="231" class="m" font-size="12.5">原生 Win32 + WinHTTP · C++17</text>
    <text x="806" y="254" class="m" font-size="12.5">匯入 token 或使用本機 OAuth 輔助程式</text>
    <text x="806" y="277" class="s" font-size="12">HKCU\Software\SJRC\AutoReader</text>
  </g>
  <rect x="48" y="364" width="1104" height="146" rx="18" fill="#f1f6f7" stroke="#b8cdd2"/>
  <text x="70" y="392" class="lbl">共同行為契約</text>
  <g class="m" font-size="12.5">
    <rect x="70" y="408" width="240" height="78" rx="10" fill="#f2f7f8" stroke="#b7cdd2"/>
    <text x="86" y="432" class="t" font-size="14" font-weight="600">Session 生命週期</text>
    <text x="86" y="453">開始 → 心跳 → 結束</text>
    <text x="86" y="472">達標、額度用盡或失敗時停止</text>
    <rect x="326" y="408" width="240" height="78" rx="10" fill="#f2f7f8" stroke="#b7cdd2"/>
    <text x="342" y="432" class="t" font-size="14" font-weight="600">時間間隔</text>
    <text x="342" y="453">每 3 秒心跳一次，time=3 秒</text>
    <text x="342" y="472">預設每 20 秒翻頁</text>
    <rect x="582" y="408" width="240" height="78" rx="10" fill="#f2f7f8" stroke="#b7cdd2"/>
    <text x="598" y="432" class="t" font-size="14" font-weight="600">單位</text>
    <text x="598" y="453">額度與時間皆以秒計</text>
    <text x="598" y="472">28800 s = 8 h · 10933 s ≈ 3.04 h</text>
    <rect x="838" y="408" width="294" height="78" rx="10" fill="#f2f7f8" stroke="#b7cdd2"/>
    <text x="854" y="432" class="t" font-size="14" font-weight="600">認證</text>
    <text x="854" y="453">x-auth-schema：CLIENT 或 PUBLIC</text>
    <text x="854" y="472">CLIENT 且有 token 時才使用 Bearer</text>
  </g>
  <rect x="48" y="540" width="700" height="156" rx="18" fill="#eef8f3" stroke="#2ee6a8" stroke-opacity="0.45"/>
  <text x="70" y="568" class="lbl">網路邊界</text>
  <text x="70" y="595" class="t" font-size="18" font-weight="650">https://api.sjrc.club/</text>
  <text x="70" y="620" class="m" font-size="12.5">HTTPS · JSON · 逾時 60 秒 · 停用重新導向 · 未固定憑證</text>
  <text x="70" y="642" class="m" font-size="12.5">閱讀、書架、首頁、帳號與 token 更新端點</text>
  <text x="70" y="670" class="s" font-size="12">只傳送帳號持有者的 token；沒有後端、代理、遙測或分析。</text>
  <rect x="772" y="540" width="380" height="156" rx="18" fill="#f1f6f7" stroke="#b8cdd2"/>
  <text x="794" y="568" class="lbl">參考資料</text>
  <text x="794" y="596" class="t" font-size="16" font-weight="650">協議整理資料 · 不含完整來源</text>
  <text x="794" y="620" class="m" font-size="12.5">從公開的 2.9.0 客戶端反編譯而來</text>
  <text x="794" y="642" class="m" font-size="12.5">用於還原標頭、單位與流程</text>
  <text x="794" y="668" class="s" font-size="12">僅供研究參考；未編入任何成品</text>
  <g stroke="#4e6d75" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <path d="M245 310v52"/><path d="M592 310v52"/><path d="M958 310v52"/>
    <path d="M592 510v28"/><path d="M360 568h-90v-42"/>
  </g>
  <text x="620" y="530" class="lbl">HTTPS / JSON</text>
</svg>
